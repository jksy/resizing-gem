# No project name is set here on purpose: the devcontainer CLI and VS Code then
# name the project after the checkout (<folder>_devcontainer), so that each git
# worktree gets its own containers. With a fixed name, `devcontainer up` in a
# second worktree would reuse the containers of the first one, which mount the
# first worktree's files. The name also differs from the project of the
# docker-compose.yml in the repository root (resizing-gem), and the service names
# differ as well (app/db here, mysql there).

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        # Default Ruby version. Other versions can be installed from inside the
        # container with `rbenv install`, so this rarely needs changing.
        RUBY_VERSION: 3.1.7
    command: sleep infinity
    environment:
      # test/test_helper.rb reads these to build the ActiveRecord connection.
      # MYSQL_DATABASE is left unset on purpose: the tests then create a database
      # per process and drop it afterwards, which keeps concurrent runs isolated.
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      # RAILS_VERSION is left unset on purpose: the Gemfile then picks the newest
      # Rails that runs on the container's Ruby. Set it here to pin another version.
    volumes:
      - ..:/workspaces/resizing-gem:cached
      - bundle:/usr/local/bundle
      # Not shared with the host: see the Dockerfile
      - vendor:/workspaces/resizing-gem/vendor
      - bundle-config:/workspaces/resizing-gem/.bundle
      - ruby-lsp:/workspaces/resizing-gem/.ruby-lsp
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7.29
    # mysql:5.7 is published for amd64 only, so run it emulated on Apple Silicon
    platform: linux/amd64
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    # MySQL 5.7 sizes its file descriptor tables from the nofile limit. On hosts
    # where containerd runs with LimitNOFILE=infinity, containers inherit about
    # 2^31, and mysqld then allocates tens of GB of memory and never gets ready.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: resizing_gem_test
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-psecret']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  # Shared by every worktree, so that a new worktree does not install all the
  # gems again. Gems of different versions live side by side in it. The name is
  # the one the volume had while the project name was fixed, to keep the gems
  # installed before.
  bundle:
    name: resizing-gem-devcontainer_bundle
  vendor:
  bundle-config:
  ruby-lsp:
  db-data:
