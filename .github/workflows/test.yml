name: test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read  # This is required for actions/checkout

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / Faraday ${{ matrix.faraday }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        rails: ['7.0', '7.1', '7.2', '8.0', '8.1']
        faraday: ['1.10', '2.0']
        exclude:
          # Rails 8.x requires Ruby 3.2+
          - ruby: '3.1'
            rails: '8.0'
          - ruby: '3.1'
            rails: '8.1'
          # Upstream does not support Ruby 4.0 on Rails 7.0 / 7.1
          - ruby: '4.0'
            rails: '7.0'
          - ruby: '4.0'
            rails: '7.1'

    runs-on: ubuntu-22.04

    env:
      RAILS_VERSION: ${{ matrix.rails }}
      FARADAY_VERSION: ${{ matrix.faraday }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: mirromutth/mysql-action@v1.1
        with:
          host port: 3306
          container port: 3306
          character set server: 'utf8mb4'
          collation server: 'utf8mb4_general_ci'
          mysql version: '5.7'
          mysql database: 'resizing_gem_test'
          mysql root password: secret

      - name: "Install ruby dependencies"
        run: |
          sudo apt update
          sudo apt install -y libyaml-dev curl libmysqlclient-dev

      - uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: bundle install
        run: |
          bundle install

      - name: Show Faraday version
        run: |
          bundle list | grep faraday

      - name: Run test
        run: |
          bundle exec rake test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Single status for the required checks: fails unless every test job
  # succeeded, including when one is skipped or cancelled.
  ci-passed:
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check test results
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          failed="$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<<"$NEEDS")"
          if [[ -n "$failed" ]]; then
            echo "::error::Test jobs did not succeed: $failed"
            exit 1
          fi
