name: lint

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install ruby dependencies"
        run: |
          sudo apt update
          sudo apt install -y libyaml-dev curl libmysqlclient-dev

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          # Matches the devcontainer, so local and CI report the same offenses
          ruby-version: '3.1'
          bundler-cache: false

      - name: bundle install
        run: |
          bundle install

      - name: Run RuboCop
        run: |
          bundle exec rubocop
